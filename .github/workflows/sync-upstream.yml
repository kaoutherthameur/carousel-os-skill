
name: Sync Original Author

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch original code and update mirror
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          git remote add upstream \
            "https://github.com/ouerf-man/${REPO_NAME}.git"

          git fetch upstream refs/heads/main

          git push --force origin \
            FETCH_HEAD:refs/heads/upstream-main
